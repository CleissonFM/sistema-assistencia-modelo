/* Layout: barra lateral clara + área de trabalho cinza-suave; cartões brancos com linhas finas; gavetas brancas com seções separadas por linhas; um único tom de destaque (trocável em Configurações) */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F4F5F7; --line:#EAECF0; --line-2:#D6DAE1;
  --fg:#101828; --muted:#5D6679; --faint:#8A93A3;
  --accent:#2F5BCF; --accent-hover:#2549AD; --accent-ink:#FFFFFF; --accent-soft:#EEF2FC;
  --rail:#FFFFFF; --rail-fg:#475467; --rail-active:#F2F4F7; --rail-hi:#101828; --rail-line:#EAECF0; --rail-accent:var(--accent);
  --ok:#067647; --ok-soft:#ECFDF3; --warn:#B54708; --warn-soft:#FFF6E5; --bad:#B42318; --bad-soft:#FEF3F2;
  --info:#175CD3; --info-soft:#EFF8FF; --vio:#5925DC; --vio-soft:#F4F3FF; --neu-soft:#F2F4F7; --note:#DC8B0B;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-muted:#555B59; --paper-line:#CCCCCC; --paper-bad:#B42318;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -8px rgba(16,24,40,.14);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --overlay:rgba(16,24,40,.32);
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

:root[data-bg="azulado"]{--bg:#F1F5FB;--surface-2:#F1F4F9}

  --fg:#ECEEF2; --muted:#A3A9B4; --faint:#737A86;
  --accent:#7AA2FF; --accent-hover:#97B6FF; --accent-ink:#0A1633; --accent-soft:#18233F;
  --rail:#111216; --rail-fg:#A3A9B4; --rail-active:#1D1F24; --rail-hi:#ECEEF2; --rail-line:#22242A;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#FBBF24; --warn-soft:#2A2010; --bad:#F87171; --bad-soft:#2D1515;
  --info:#7CB4FF; --info-soft:#142238; --vio:#B9A4FF; --vio-soft:#211A39; --neu-soft:#1E2025; --note:#FBBF24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -8px rgba(0,0,0,.55); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-accent="marinho"]:not([data-theme="light"]):not([data-tema="claro"]){--accent:#93A9E8;--accent-hover:#AABBEE;--accent-ink:#0C1838;--accent-soft:#1A2442}
  :root[data-accent="ardosia"]:not([data-theme="light"]):not([data-tema="claro"]){--accent:#C3CDDA;--accent-hover:#D8E0EA;--accent-ink:#10161F;--accent-soft:#222A35}
  :root[data-accent="grafite"]:not([data-theme="light"]):not([data-tema="claro"]){--accent:#F2F3F5;--accent-hover:#FFFFFF;--accent-ink:#141519;--accent-soft:#25272D}
  :root[data-accent="petroleo"]:not([data-theme="light"]):not([data-tema="claro"]){--accent:#5CC6DC;--accent-hover:#7FD3E5;--accent-ink:#052A33;--accent-soft:#0F2A31}
}
:root[data-theme="dark"][data-accent="marinho"]:not([data-tema="claro"]),:root[data-tema="escuro"][data-accent="marinho"]{--accent:#93A9E8;--accent-hover:#AABBEE;--accent-ink:#0C1838;--accent-soft:#1A2442}
:root[data-theme="dark"][data-accent="ardosia"]:not([data-tema="claro"]),:root[data-tema="escuro"][data-accent="ardosia"]{--accent:#C3CDDA;--accent-hover:#D8E0EA;--accent-ink:#10161F;--accent-soft:#222A35}
:root[data-theme="dark"][data-accent="grafite"]:not([data-tema="claro"]),:root[data-tema="escuro"][data-accent="grafite"]{--accent:#F2F3F5;--accent-hover:#FFFFFF;--accent-ink:#141519;--accent-soft:#25272D}
:root[data-theme="dark"][data-accent="petroleo"]:not([data-tema="claro"]),:root[data-tema="escuro"][data-accent="petroleo"]{--accent:#5CC6DC;--accent-hover:#7FD3E5;--accent-ink:#052A33;--accent-soft:#0F2A31}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.015em}
h1{font-size:24px;letter-spacing:-.025em}
h2{font-size:17px}
h3{font-size:15px}
.ic{flex:none}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}

/* Estrutura */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;overflow-y:auto;background:var(--rail);border-right:1px solid var(--rail-line);color:var(--rail-fg);display:flex;flex-direction:column;gap:1px;padding:20px 12px 16px;padding-left:max(12px,env(safe-area-inset-left,0px));z-index:50}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.mark{width:34px;height:34px;display:grid;place-items:center;flex:none}
.mark .logo{display:block;border-radius:9px;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.mark:has(.logo-img){width:auto;min-width:34px}
.mark .logo-img{display:block;height:34px;width:auto;max-width:112px;object-fit:contain;border-radius:6px}
body.menu-mini .mark .logo-img{max-width:44px}
.doc-logo{display:block;max-height:46px;max-width:170px;object-fit:contain;margin-bottom:8px}
.logo-cfg{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-prev{width:88px;height:88px;border:1px dashed var(--line-2);border-radius:14px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden;flex:none}
.logo-prev img{max-width:80px;max-height:80px;object-fit:contain}
.logo-prev svg{width:56px;height:56px}
.brand b{display:block;color:var(--rail-hi);font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--rail-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav-l{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.nav a,.nav .nav-ai{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--rail-fg);font:500 14px var(--f-ui);text-decoration:none;cursor:pointer;text-align:left}
.nav a .ic{color:var(--faint)}
.nav .nav-ai .ic{color:var(--rail-accent)}
.nav a:hover,.nav .nav-ai:hover{background:var(--rail-active);color:var(--rail-hi)}
.nav a.on{background:var(--rail-active);color:var(--rail-hi);font-weight:600}
.nav a.on .ic{color:var(--accent)}
.nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--neu-soft);border-radius:999px;padding:0 7px;line-height:20px;font-variant-numeric:tabular-nums}
.nav a.on .cnt{background:var(--surface)}
.nav a:focus-visible,.nav .nav-ai:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.side-foot{margin-top:10px;border-top:1px solid var(--rail-line);padding:14px 10px 0;font-size:12px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.side-foot .pill{display:inline-flex;align-items:center;gap:7px;color:var(--rail-hi);font-weight:500}
.side-foot .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--note)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);display:flex;gap:10px;align-items:center;padding-block:14px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.btn.menu-btn{display:none}
.gs{position:relative;flex:1;max-width:520px;min-width:0}
.gs input{padding-left:38px;padding-right:38px}
.gs>.ic{position:absolute;left:12px;top:11px;color:var(--faint)}
.gs>kbd{position:absolute;right:10px;top:10px;font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.gs-res{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:380px;overflow:auto;padding:6px}
.gs-res button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--fg);font-size:13.5px}
.gs-res button:hover,.gs-res button:focus-visible{background:var(--surface-2);outline:none}
.gs-res .t{font-size:11.5px;font-weight:500;color:var(--muted);width:62px;flex:none}
.gs-res .empty{padding:12px;color:var(--muted)}
.gs-res .ai-ask,.gs-res .ai-ask:hover{background:var(--accent-soft);margin-bottom:4px}
.gs-res .ai-ask .ic{color:var(--accent)}
.gs-res .ai-ask .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-res .ai-ask b{font-weight:600}
.gs-res kbd{margin-left:auto;flex:none;font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--surface)}
.top-act{display:flex;gap:8px;margin-left:auto}
.view{padding-block:28px 72px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%;container-type:inline-size}
.scrim{display:none}

/* Botões e marcadores */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font:600 13.5px var(--f-ui);cursor:pointer;white-space:nowrap;text-decoration:none;box-shadow:var(--shadow-sm);transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);box-shadow:none}
.btn.soft:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:var(--neu-soft);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.warn-c{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;padding:0}
.btn:focus-visible,.tg:focus-visible,.ck:focus-visible,.prod:focus-visible,.seg button:focus-visible,.fchip:focus-visible,.stat:focus-visible,.sug:focus-visible,.ref:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px}
.card-b{padding:4px 20px 20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph .sub{margin:4px 0 0;color:var(--muted)}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neu-soft);color:var(--muted);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 16%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.vio{background:var(--vio-soft);color:var(--vio)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.lg{height:28px;padding:0 11px;font-size:13px}
.chip.strike{text-decoration:line-through}

/* Tabelas */
.tbl-wrap{overflow-x:auto}
.card .tbl-wrap{border-top:1px solid var(--line)}
.card>.tbl-wrap:first-child{border-top:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.card th:first-child,.card td:first-child{padding-left:20px}
.card th:last-child,.card td:last-child{padding-right:20px}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .l2{display:block;font-size:12px;color:var(--muted)}
td .mono{white-space:nowrap}
.card td{white-space:nowrap}
.card td[style*="max-width"]{white-space:normal}
td b{font-weight:600}
.late{color:var(--bad);font-weight:500}
.empty-row{padding:32px;text-align:center;color:var(--muted)}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .s.alert{color:var(--bad);font-weight:500}
.kpis.k5,.kpis.k3{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpis.k5>.kpi,.kpis.k3>.kpi{border:0;border-radius:0}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k5 .kpi,.kpis.k3 .kpi{container-type:inline-size}
.kpis.k5 .kpi .v,.kpis.k3 .kpi .v{font-size:clamp(20px,14cqi,28px)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stat{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);cursor:pointer;text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit;transition:border-color .15s,background-color .15s}
.stat:hover{border-color:var(--line-2);background:var(--surface-2)}
.stat b{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat i{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.list .grow{flex:1;min-width:0}
.list .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .grow span{font-size:12.5px;color:var(--muted)}

/* Formulários */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:500;color:var(--fg)}
.fld>small{font-size:12px;color:var(--muted)}
input,select,textarea{font:400 14px var(--f-ui);color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;height:40px;padding:0 12px;width:100%;min-width:0;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
input.mono{font-family:var(--f-mono);font-size:13.5px}
.g2,.g3,.g4{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.span-all{grid-column:1/-1}
.sec{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h small{color:var(--muted);font-size:12.5px}
.form{display:flex;flex-direction:column;gap:14px}
.imei-st{font-size:12px;font-weight:500}
.imei-st.ok{color:var(--ok)}
.imei-st.bad{color:var(--bad)}
.ck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ck{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;font:500 13px var(--f-ui);color:var(--fg);text-align:left}
.ck b{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--neu-soft);color:var(--muted);font-weight:500;flex:none}
.ck.ok b{background:var(--ok-soft);color:var(--ok)}
.ck.def{border-color:var(--bad)}
.ck.def b{background:var(--bad-soft);color:var(--bad)}
.ck[disabled]{cursor:default}
.tgs{display:flex;gap:6px;flex-wrap:wrap}
.tg{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:500 13px var(--f-ui);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tg:hover{background:var(--surface-2)}
.tg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.it-row{display:grid;grid-template-columns:110px minmax(0,1fr) 64px 110px 32px;gap:8px;align-items:center}
.it-row.nf{grid-template-columns:minmax(0,1fr) 108px 72px 60px 100px 32px}
.it-head{font-size:12px;font-weight:500;color:var(--muted)}
.it-tot{display:flex;justify-content:flex-end;gap:16px;align-items:baseline;padding-top:10px;border-top:1px solid var(--line)}
.it-tot b{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.form-err{color:var(--bad);font-weight:500;font-size:13px;margin-right:auto;align-self:center}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.seg{display:inline-flex;background:var(--neu-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;font:500 13px var(--f-ui);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.fld>.seg{align-self:flex-start}
.filters{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.fchip{height:32px;padding:0 12px;border-radius:8px;border:0;background:transparent;font:500 13px var(--f-ui);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.fchip:hover{background:var(--surface-2);color:var(--fg)}
.fchip em{font-style:normal;font-size:11.5px;background:var(--neu-soft);color:var(--muted);border-radius:999px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--neu-soft);color:var(--fg)}
.fchip.on em{background:var(--surface);color:var(--fg)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px}
.toolbar input{max-width:300px;height:36px}
.bat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.bat i{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px;display:inline-block}
.bat u{display:block;height:100%;background:currentColor;border-radius:1px}
.bat.ok{color:var(--ok)}.bat.warn{color:var(--warn)}.bat.bad{color:var(--bad)}

/* Balcão */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.pdv-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px}
.pdv-tools input{flex:1;min-width:180px;height:36px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 16px 16px}
.prod{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
.prod:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.prod[disabled]{opacity:.5;cursor:default}
.prod .pn{font-weight:600;font-size:14px}
.prod .pm{font-size:12.5px;color:var(--muted)}
.prod .pr{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.prod .pp{font-weight:600;font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pdv-cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .d{font-weight:600;font-size:13.5px}
.ci .m{font-size:12px;color:var(--muted)}
.ci .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:8px}
.qty button{width:26px;height:24px;border:0;background:none;cursor:pointer;color:var(--fg);font-weight:600}
.qty span{min-width:20px;text-align:center;font-weight:600;font-size:12.5px}
.tot-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.tot-big{font-size:26px;font-weight:600;letter-spacing:-.025em}
.cart-empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:13px}

/* Gavetas e janelas */
.ovl{position:fixed;inset:0;z-index:60;display:flex}
.ovl-bg{position:absolute;inset:0;background:var(--overlay)}
.drawer{position:relative;margin-left:auto;width:min(760px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.dh{padding:16px 24px;padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface)}
.db{flex:1;overflow:auto;padding:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.db:has(>.paper){background:var(--surface-2)}
.db .form{gap:22px}
.db .sec{border:0;border-radius:0;padding:0;background:transparent}
.db .sec+.sec{border-top:1px solid var(--line);padding-top:22px}
.db .sec th:first-child,.db .sec td:first-child{padding-left:0}
.db .sec th:last-child,.db .sec td:last-child{padding-right:0}
.db .list{margin:0!important}
.db .list li{padding-left:0;padding-right:0}
.df{padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.modal-wrap{align-items:center;justify-content:center;padding:16px}
.modal{position:relative;width:min(760px,100%);max-height:100%;background:var(--surface);border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.modal .db{padding:22px}
.modal.narrow{width:min(560px,100%)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px 20px}
.kv div{min-width:0}
.kv dt{font-size:12px;font-weight:500;color:var(--muted)}
.kv dd{margin:3px 0 0;font-weight:500;overflow-wrap:anywhere}
.steps{display:flex;gap:4px;overflow-x:auto}
.steps div{flex:1;min-width:86px;display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:500;color:var(--faint)}
.steps div::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps .done{color:var(--muted)}
.steps .done::before{background:var(--accent)}
.steps .cur{color:var(--fg);font-weight:600}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;font-size:13px}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums}
.tl b{font-weight:600}
.opt-cards{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;background:var(--surface);cursor:pointer}
.opt input{width:auto;height:auto;margin-top:3px;padding:0;box-shadow:none;accent-color:var(--accent)}
.opt b{display:block;font-weight:600}
.opt span{font-size:12.5px;color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px}
.banner .ic{color:var(--warn);margin-top:1px}
.banner b{font-weight:600}
.banner p{margin:3px 0 0;color:var(--muted);font-size:13px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ok{color:var(--ok)}.checks .bad{color:var(--bad)}

/* Documentos em papel */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:28px 30px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.5;border:1px solid var(--line)}
.paper .pm{color:var(--paper-muted)}
.paper h4{margin:0;font-size:15px;font-weight:700}
.paper table{font-size:12px;color:var(--paper-ink)}
.paper th{color:var(--paper-muted);border-bottom:1px solid var(--paper-ink);padding:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.paper td{border-bottom:1px solid var(--paper-line);padding:6px}
.paper .hr{border-top:1px dashed var(--paper-ink);margin:10px 0}
.paper .row{display:flex;justify-content:space-between;gap:10px}
.paper .sim{border:1.5px dashed var(--paper-bad);color:var(--paper-bad);font-weight:700;text-align:center;padding:6px;font-size:11px;letter-spacing:.04em;margin-bottom:12px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.paper .sig div{border-top:1px solid var(--paper-ink);padding-top:4px;text-align:center;font-size:11px;color:var(--paper-muted)}
.paper .box{border:1px solid var(--paper-line);border-radius:4px;padding:8px 10px}
.paper .cap{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);font-weight:600}
.paper.receipt{max-width:400px;margin:0 auto;font-family:var(--f-mono);font-size:11px;padding:20px 18px}
.paper.receipt table{font-size:10.5px}
.paper .chave{font-size:11.5px;letter-spacing:.02em;word-spacing:4px;text-align:center;font-weight:500}
.qr{display:block;margin:10px auto;width:132px;height:132px}
.doc-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--paper-ink);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ckd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 14px;font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Aparência */
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 8px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--fg);font:500 13px var(--f-ui);cursor:pointer}
.sw:hover{background:var(--surface-2)}
.sw i{width:20px;height:20px;border-radius:6px;display:block;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.sw-accent-azul{background:#2F5BCF}.sw-accent-marinho{background:#1F3A7A}.sw-accent-ardosia{background:#475569}.sw-accent-grafite{background:#27272A}.sw-accent-petroleo{background:#0E6F86}
.sw-tema-claro{background:#FFFFFF}.sw-tema-auto{background:linear-gradient(135deg,#FFFFFF 50%,#141519 50%)}.sw-tema-escuro{background:#141519}
.sw-bg-cinza{background:#F6F7F9}.sw-bg-branco{background:#FFFFFF}.sw-bg-azulado{background:#E9F0FA}

/* Assistente IA */
.spark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ai-h3{display:flex;align-items:center;gap:8px}
.ai-h3 .ic{color:var(--accent)}
.ai{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:55;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.ai-h{display:flex;align-items:center;gap:6px;padding:14px 12px 14px 18px;border-bottom:1px solid var(--line)}
.ai-title{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ai-title>div{min-width:0}
.ai-title b{display:block;font-size:15px;font-weight:600}
.ai-title small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.ai-in{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ai-box{display:flex;gap:6px;align-items:flex-end;border:1px solid var(--line-2);border-radius:14px;padding:5px 5px 5px 12px;background:var(--surface);box-shadow:var(--shadow-sm)}
.ai-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ai-box textarea{border:0;border-radius:0;box-shadow:none!important;padding:7px 0;height:34px;min-height:34px;max-height:140px;resize:none;background:transparent;line-height:1.4}
.ai-box .btn{width:34px;height:34px;padding:0;border-radius:10px;flex:none}
.ai-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ai-row .seg button{height:26px;padding:0 10px;font-size:12px}
.ai-note{font-size:12px;color:var(--muted);margin:0}
.msg-u{align-self:flex-end;max-width:88%;background:var(--neu-soft);padding:10px 14px;border-radius:14px 14px 4px 14px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-a{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg-a .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:500;color:var(--muted)}
.msg-a .meta .ic{color:var(--accent)}
.msg-a .txt{font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.msg-a .txt:empty{display:none}
.msg-a .txt p{margin:0 0 8px}
.msg-a .txt ul,.msg-a .txt ol{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.msg-a .txt>:last-child{margin-bottom:0}
.msg-a .txt b{font-weight:600}
.msg-err{font-size:13px;font-weight:500;color:var(--bad)}
.msg-actions{display:flex;gap:2px;flex-wrap:wrap;margin-left:-8px}
.ref{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:24px;padding:0 8px;margin:1px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--fg);font:500 12.5px var(--f-ui);vertical-align:middle;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm)}
.ref span{overflow:hidden;text-overflow:ellipsis}
.ref .ic{color:var(--accent)}
.ref:hover{border-color:var(--accent);background:var(--accent-soft)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.ai-empty{display:flex;flex-direction:column;gap:14px}
.ai-empty h3{font-size:17px}
.ai-empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.scan{display:flex;flex-wrap:wrap;gap:6px}
.scan span{font-size:12px;font-weight:500;color:var(--muted);background:var(--neu-soft);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:500 13px var(--f-ui);color:var(--fg);cursor:pointer;transition:border-color .15s,background-color .15s}
.sug .ic{color:var(--accent)}
.sug:hover{border-color:var(--line-2);background:var(--surface-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
body.ai-open .ai-card{display:none}
@media (min-width:1280px){body.ai-open .main,body.pz-open .main{margin-right:420px}body.ai-open .ai,body.pz-open .pz{box-shadow:none}}

/* Personalizar */
.side-tools{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:12px}
.side-btn{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--rail-fg);font:500 14px var(--f-ui);cursor:pointer;text-align:left}
.side-btn .ic{color:var(--faint)}
.side-btn:hover{background:var(--rail-active);color:var(--rail-hi)}
.side-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pz-sec{display:flex;flex-direction:column;gap:14px}
.pz-sec+.pz-sec{border-top:1px solid var(--line);padding-top:20px}
.lay-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lay-row{display:flex;align-items:center;gap:10px;padding:7px 6px 7px 12px;background:var(--surface)}
.lay-row+.lay-row{border-top:1px solid var(--line)}
.lay-row.off .lay-ic,.lay-row.off .lay-nm,.lay-row.off .lay-nome,.lay-row.off .lay-col{opacity:.45}
.lay-ic{display:inline-flex;color:var(--faint)}
.lay-nm{flex:1;min-width:0;font-size:13.5px;font-weight:500}
.lay-nome{flex:1;min-width:0;height:34px;font-size:13.5px;box-shadow:none}
.lay-col{width:auto;flex:none;height:32px;font-size:12.5px;padding:0 6px;box-shadow:none}
.lay-mv{display:inline-flex;flex:none}
.lay-mv .btn.icon-btn{width:28px;height:28px}
.lay-opt{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;cursor:pointer;width:fit-content}
.lay-opts{display:flex;flex-direction:column;gap:10px}
.tgl{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:34px;height:20px;min-width:0;padding:0;margin:0;border:0;border-radius:999px;background:var(--line-2);box-shadow:none;cursor:pointer;transition:background-color .15s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(16,24,40,.25);transition:transform .15s}
.tgl:checked{background:var(--accent)}
.tgl:checked::after{transform:translateX(14px)}
.tgl:focus{box-shadow:none}
.tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tgl:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:900px){.mini-tg{display:none}}
/* Menu só com ícones */
@media (min-width:901px){
  body.menu-mini .app{grid-template-columns:68px minmax(0,1fr)}
  body.menu-mini .side{padding-left:10px;padding-right:10px}
  body.menu-mini .brand{justify-content:center;padding:2px 0 14px}
  body.menu-mini .brand>div:last-child,body.menu-mini .side .nl,body.menu-mini .side-foot{display:none}
  body.menu-mini .nav-l{height:1px;padding:0;margin:8px;background:var(--rail-line);font-size:0;overflow:hidden}
  body.menu-mini .nav a,body.menu-mini .nav .nav-ai,body.menu-mini .side-btn{justify-content:center;padding:10px 0;position:relative}
  body.menu-mini .nav a .cnt{position:absolute;top:2px;right:6px;margin:0;min-width:16px;padding:0 4px;line-height:16px;font-size:10px;text-align:center}
}
/* Densidade compacta */
body.dens-compacta .view{gap:14px;padding-block:20px 56px}
body.dens-compacta .stack,body.dens-compacta .grid-2{gap:14px}
body.dens-compacta .top{padding-block:10px}
body.dens-compacta .card-h{padding:12px 16px 8px}
body.dens-compacta .card-b{padding:2px 16px 14px}
body.dens-compacta th,body.dens-compacta td{padding-top:7px;padding-bottom:7px}
body.dens-compacta .list li{padding-top:8px;padding-bottom:8px}
body.dens-compacta .kpi{padding:12px 16px}
body.dens-compacta .kpis.k5 .kpi .v,body.dens-compacta .kpis.k3 .kpi .v{font-size:clamp(18px,12cqi,22px)}
body.dens-compacta .stat{padding:8px 12px}
body.dens-compacta .stat b{font-size:20px}
body.dens-compacta .btn{height:34px}
body.dens-compacta .btn.sm{height:28px}
body.dens-compacta .icon-btn{width:34px}
body.dens-compacta input,body.dens-compacta select{height:36px}
body.dens-compacta .prod{padding:10px 12px}

/* Informações originais */
.orig{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}
.orig-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.orig-h b{font-weight:600}
.orig-h span{font-size:12px}
.orig-tip{margin:0;font-size:12.5px;color:var(--muted)}
.orig textarea{min-height:60px;font-size:13px}
.orig-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.orig-st{font-size:12.5px;color:var(--muted)}
.orig-st.ok{color:var(--ok)}
.orig-st.bad{color:var(--bad)}
.orig-st:empty{display:none}
.orig-fab{font-size:13px}
.orig-est{font-size:13px;color:var(--muted)}
.orig-est:empty{display:none}
.orig-est b{color:var(--fg);font-weight:600}
.banner.bad .ic{color:var(--bad)}

/* Equipe, metas, planilha, procedência, gastos e cliente rápido */
.metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.metas-p{grid-template-columns:minmax(0,1fr)}
.meta{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;cursor:pointer;font:inherit;color:inherit;width:100%}
.meta:hover{border-color:var(--line-2)}
.meta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta-top b{font-weight:600}
.meta-nm,.meta-num{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta-num b{color:var(--fg);font-weight:600}
.bar{display:block;height:8px;border-radius:999px;background:var(--neu-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.bar.warn i{background:var(--warn)}
.interno{margin-top:14px;border:1px dashed var(--line-2);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:13px;display:flex;flex-direction:column;gap:8px}
.interno-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.interno p{margin:0}
.pl th,.pl td{padding-left:10px;padding-right:10px}
.pl th:first-child,.pl td:first-child{padding-left:16px}
.pl th:last-child,.pl td:last-child{padding-right:16px}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.th-sort.on{color:var(--fg);font-weight:600}
.row-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.tot td{background:var(--surface-2)}
.tl-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:0;cursor:pointer;color:var(--fg);font:inherit}
.tl-item span{color:var(--muted);font-size:12.5px}
.tl-item:hover b{color:var(--accent)}
.calc{height:40px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.calc b{font-weight:600}
.rep{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.rep-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rep-h b{font-weight:600}
.rep-acts{display:flex;gap:6px;flex-wrap:wrap}
.rep-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 140px auto 32px;gap:8px;align-items:center}
.rep-row.ok input:first-child{text-decoration:line-through;color:var(--muted)}
.ga-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 120px 110px 32px;gap:8px;align-items:center}
.ga-head{font-size:12px;font-weight:500;color:var(--muted)}
.cp{display:flex;flex-direction:column;gap:8px}
.cp-in{position:relative}
.cp-in .ic{position:absolute;left:12px;top:12px;color:var(--faint)}
.cp-in input{padding-left:38px}

.cp-card .grow{flex:1;min-width:0}

.nw{white-space:nowrap}
.cp-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;flex:none}
.cp-novo{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}

.crm{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}

.ax-grid{display:flex;flex-wrap:wrap;gap:10px}
.ax{position:relative}
.ax-th{width:96px;height:96px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0;overflow:hidden;cursor:pointer;display:grid;place-items:center}
.ax-th img{width:100%;height:100%;object-fit:cover;display:block}
.ax-pdf{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.ax-rm{position:absolute;top:4px;right:4px;width:26px;height:26px;background:var(--surface);box-shadow:var(--shadow-sm)}
.ax-add{width:96px;height:96px;border:1px dashed var(--line-2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface)}
.ax-add:hover{background:var(--accent-soft)}
.ax-env{font-size:12.5px;color:var(--muted)}

.cons-l{display:flex;flex-direction:column;gap:8px}
.cons-l .btn{height:auto;justify-content:flex-start;text-align:left;padding:10px 14px;white-space:normal}
.cons-l .btn span{display:flex;flex-direction:column;gap:2px}
.cons-l .btn small{font-weight:400;color:var(--muted);font-size:12.5px}

function qrSVG(seed){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  const N=25,cells=[];const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const finder=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>1&&i<5&&j>1&&j<5);if(e)cells.push([x+i,y+j])}};
  finder(0,0);finder(N-7,0);finder(0,N-7);
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(!inF(x,y)&&rnd()>.52)cells.push([x,y]);
  return `<svg class="qr" viewBox="-2 -2 ${N+4} ${N+4}" role="img" aria-label="QR Code de consulta (simulação)"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" fill="#FFFFFF"/>${cells.map(([x,y])=>`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#111111"/>`).join('')}</svg>`;
}

function chart7(){
  const dias=[...Array(7)].map((_,i)=>{const d=todayStart();d.setDate(d.getDate()-6+i);return d});
  const vals=dias.map(d=>sum(DB.vendas.filter(v=>sameDay(v.data,d)).map(v=>v.total)));
  const mx=Math.max(...vals,100);const step=mx>4000?2000:mx>1000?500:100;const top=Math.ceil(mx/step)*step;
  const W=640,H=210,L=56,R=10,T=18,B=30,cw=(W-L-R)/7,bw=cw*.56;const y=v=>T+(H-T-B)*(1-v/top);
  const k=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
  const grid=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">R$ ${k(v)}</text>`).join('');
  const bars=vals.map((v,i)=>{const x=L+i*cw+(cw-bw)/2,hj=i===6;return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,H-B-y(v))}" rx="6" fill="var(--accent)" fill-opacity="${hj?1:.28}"><title>${dias[i].toLocaleDateString('pt-BR')}: ${brl(v)}</title></rect>${v?`<text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">${k(v)}</text>`:''}<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="${hj?'var(--fg)':'var(--muted)'}" font-weight="${hj?600:400}">${hj?'Hoje':dias[i].toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</text>`}).join('');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Faturamento diário dos últimos 7 dias">${grid}${bars}</svg></div>`;
}

  const ask=AI.sample!==null?`<button class="ai-ask" data-act="aiAskQ" data-q="${esc(raw.trim())}" data-gs="1">${ic('spark',16)}<span class="q">Perguntar à IA: <b>${esc(raw.trim())}</b></span><kbd>Enter</kbd></button>`:'';
  $('#gsRes').innerHTML=ask+(r.length?r.slice(0,10).map(([t,l,a,id])=>`<button data-act="${a}" data-id="${id}" data-gs="1"><span class="t">${t}</span><span>${esc(l)}</span></button>`).join(''):`<div class="empty">Nenhum registro com “${esc(raw.trim())}”.${ask?' Pergunte à IA acima.':''}</div>`);

function aiSnapshot(){
  const enc=new TextEncoder(),fechadas=DB.os.filter(o=>FECHADAS.includes(o.status)).length;
  const lim={os:1e9,vendas:1e9,notas:1e9};let snap,json;
  for(let i=0;i<40;i++){
    snap=aiBuild(lim);json=JSON.stringify(snap);
    if(enc.encode(json).length<=AI_BUDGET)break;
    const sz={os:JSON.stringify(snap.ordens_de_servico).length,vendas:JSON.stringify(snap.vendas).length,notas:JSON.stringify(snap.notas_fiscais).length};
    const k=Object.keys(sz).sort((a,b)=>sz[b]-sz[a])[0];
    const cur={os:Math.min(lim.os,fechadas),vendas:snap.vendas.length,notas:snap.notas_fiscais.length}[k];
    if(cur<=0)break;
    lim[k]=Math.floor(cur*.6);
  }
  return {snap,json};
}

function aiRefInfo(r){
  r=String(r).trim().replace(/^(os|ven)\s*#\s*/i,(_,p)=>p.toUpperCase()+'#').replace(/^(cli|iph|ace|nf)\s*:\s*/i,(_,p)=>p.toUpperCase()+':');
  let m,x;
  if((m=r.match(/^OS#(\d+)$/))&&(x=DB.os.find(o=>String(o.num)===m[1])))return {label:'OS #'+x.num,act:'openOS',id:x.id,icon:'os',k:'ordem de serviço'};
  if((m=r.match(/^CLI:(\S+)$/))&&(x=getCli(m[1])))return {label:x.nome,act:'openCli',id:x.id,icon:'clientes',k:'cliente'};
  if((m=r.match(/^IPH:(\S+)$/))&&(x=DB.iphones.find(i=>i.id===m[1])))return {label:`${x.modelo} ${x.cap}${x.imei?' · …'+String(x.imei).slice(-4):''}`,act:'formIph',id:x.id,icon:'phone',k:'iPhone do estoque'};
  if((m=r.match(/^ACE:(\S+)$/))&&(x=DB.acessorios.find(a=>a.id===m[1])))return {label:x.nome,act:'formAcess',id:x.id,icon:'estoque',k:'acessório'};
  if((m=r.match(/^VEN#(\d+)$/))&&(x=DB.vendas.find(v=>String(v.num)===m[1])))return {label:'Venda #'+x.num,act:'recibo',id:x.id,icon:'vendas',k:'venda'};
  if((m=r.match(/^NF:(.+)-(\d+)$/))&&(x=DB.notas.find(n=>n.modelo.toLowerCase()===m[1].toLowerCase()&&String(n.numero)===m[2])))return {label:`${x.modelo} ${x.numero}`,act:'verNota',id:x.id,icon:'notas',k:'nota fiscal'};
  return null;
}
const refChip=i=>`<button type="button" class="ref" data-act="${i.act}" data-id="${esc(i.id)}" title="Abrir ${esc(i.k)}">${ic(i.icon,13)}<span>${esc(i.label)}</span></button>`;
function aiInline(s){
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'\u0001$1\u0002');
  const h=s.split(/(\[\[[^\]\n]{1,60}\]\])/g).map(part=>{
    const t=part.match(/^\[\[([^\]\n]+)\]\]$/);
    if(t){const inf=aiRefInfo(t[1]);return inf?refChip(inf):esc(t[1])}
    return esc(part).replace(/\b(OS|Venda)\s?#\s?(\d{3,})\b/g,(all,k,n)=>{const inf=aiRefInfo((k==='OS'?'OS#':'VEN#')+n);return inf?refChip(inf):all});
  }).join('');
  return h.replace(/\u0001/g,'<b>').replace(/\u0002/g,'</b>');
}
function aiMd(src,live){
  if(live)src=src.replace(/\[\[[^\]\n]*\]?$/,'');
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const line of src.split('\n')){
    const t=line.trim();if(!t)continue;
    let mm=t.match(/^[-•*]\s+(.+)$/);
    if(mm){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push(`<li>${aiInline(mm[1])}</li>`);continue}
    mm=t.match(/^(\d+)[.)]\s+(.+)$/);
    if(mm){if(list!=='ol'){close();out.push(`<ol start="${+mm[1]}">`);list='ol'}out.push(`<li>${aiInline(mm[2])}</li>`);continue}
    close();
    mm=t.match(/^#{1,6}\s+(.+)$/);
    out.push(mm?`<p><b>${aiInline(mm[1])}</b></p>`:`<p>${aiInline(t)}</p>`);
  }
  close();return out.join('');
}
const aiPlain=t=>String(t||'').replace(/\[\[([^\]\n]{1,60})\]\]/g,(_,r)=>{const i=aiRefInfo(r);return i?i.label:r}).replace(/\*\*/g,'');

function origLocal(t){
  const L=String(t).replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
  const find=re=>L.find(x=>re.test(x))||'';
  const MES={jan:1,feb:2,fev:2,mar:3,apr:4,abr:4,may:5,mai:5,jun:6,jul:7,aug:8,ago:8,sep:9,set:9,oct:10,out:10,nov:11,dec:12,dez:12};
  const p2=n=>String(n).padStart(2,'0');
  const dt=s=>{let m;
    if((m=s.match(/(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
    if((m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/)))return `${m[3]}-${m[2]}-${m[1]}`;
    if((m=s.match(/\b([a-zç]{3})[a-zç]*\.?\s+(\d{1,2}),?\s+(\d{4})/i))&&MES[m[1].toLowerCase()])return `${m[3]}-${p2(MES[m[1].toLowerCase()])}-${p2(m[2])}`;
    if((m=s.match(/\b(\d{1,2})\s+(?:de\s+)?([a-zç]{3})[a-zç]*\.?\s+(?:de\s+)?(\d{4})/i))&&MES[m[2].toLowerCase()])return `${m[3]}-${p2(MES[m[2].toLowerCase()])}-${p2(m[1])}`;
    return null};
  const val=s=>{const i=s.indexOf(':');return i>=0?s.slice(i+1).trim():''};
  const r={};
  const im=String(t).match(/\b(\d{15})\b/);if(im)r.imei=im[1];
  const sl=find(/serial|s[ée]rie/i),sm=val(sl).match(/\b([A-Z0-9]{8,14})\b/i);if(sm&&!/^\d+$/.test(sm[1]))r.serie=sm[1].toUpperCase();
  const pc=find(/purchase\s*date|data\s*d[ae]\s*compra/i);if(pc)r.data_compra=dt(val(pc)||pc);
  const wl=find(/warranty|garantia|coverage|cobertura/i);
  if(/expired|expirad|out of warranty|fora da garantia|inactive|inativ/i.test(wl))r.garantia='Expirada';else if(/active|ativ|in warranty|dentro da garantia/i.test(wl))r.garantia='Ativa';
  const we=find(/expir.*\d|end date|coverage end|t[ée]rmino|v[aá]lid[ao]\s+at[ée]|until/i),de=we&&dt(we);
  if(de){r.garantia_ate=de;if(!r.garantia)r.garantia=new Date(de+'T12:00')>new Date()?'Ativa':'Expirada'}
  const ac=find(/applecare/i);if(ac){const v=val(ac);if(/\b(no|n[ãa]o|inactive|expired|expirad|not)\b/i.test(v))r.applecare=false;else if(/\b(yes|sim|active|ativ)/i.test(v))r.applecare=true}
  const fm=find(/find my|buscar|icloud|fmi|activation lock/i),fv=val(fm);if(fm){if(/\b(on|ativad[oa]|enabled|lost)\b/i.test(fv))r.icloud='Ativado';else if(/\b(off|desativad[oa]|disabled|clean)\b/i.test(fv))r.icloud='Desativado'}
  const sk=find(/sim[- ]?lock|carrier lock|lock status|bloqueio de operadora/i);if(sk){if(/unlocked|desbloquead|not locked/i.test(sk))r.operadora_bloqueio='Desbloqueado';else if(/\blocked\b|bloquead/i.test(val(sk)))r.operadora_bloqueio='Bloqueado'}
  const bl=find(/blacklist|gsma|lost or stolen|stolen|roubo|furto|restri[çc][ãa]o|impedid|bloqueio/i);if(bl){if(/clean|sem restri|not\s+(lost|stolen|blacklisted)|limpo|regular|n[ãa]o\s+(est[áa]\s+impedid|consta|h[áa]\s+(registro|restri)|possui\s+(registro|restri|indica))/i.test(bl))r.restricao='Sem restrição';else if(/blacklisted|lost|stolen|com restri|bloquead|impedid|indica[çc][ãa]o de restri|pass[ií]vel de bloqueio/i.test(bl))r.restricao='Com restrição'}
  const pa=find(/purchase country|country|pa[ií]s/i),pv=val(pa);if(pv&&pv.length<40)r.pais_compra=pv;
  const mo=find(/^model|^modelo|^description|^descri[çc][ãa]o/i),mv=mo&&val(mo).match(/iPhone[\w\s()ª]*?(?=\s*\d+\s*(?:GB|TB)|,|$)/i);if(mv)r.modelo=mv[0].trim();
  const cp=String(t).match(/(\d+)\s*(GB|TB)\b/i);if(cp)r.capacidade=`${cp[1]} ${cp[2].toUpperCase()}`;

  if(rse&&!fse&&/^[A-Z0-9]{8,14}$/.test(rse)){d.serie=rse;const el=$(cx.serieIn);if(el)el.value=rse;n.push('nº de série')}

const DIA=864e5;
function funcById(id){return (DB.funcionarios||[]).find(f=>f.id===id)}
function funcByNome(n){return (DB.funcionarios||[]).find(f=>f.nome===n)}
function funcsAtivos(){return (DB.funcionarios||[]).filter(f=>f.ativo!==false)}
function tecPadrao(){const l=funcsAtivos();return (l.find(f=>/técnico/i.test(f.funcao||''))||l[0]||{}).id||''}
function vendPadrao(){const l=funcsAtivos(),p=getPref('vendedor','');return (l.find(f=>f.id===p)||l.find(f=>+f.comVenda)||l[0]||{}).id||''}
function donoNome(){const d=(DB.funcionarios||[]).find(f=>f.dono);return d?d.nome:'Dono'}
function regraTxt(f){const p=[];if(+f.comServico)p.push(`${brl(f.comServico)} por serviço${f.soSemDono?' feito sem o dono':''}`);if(+f.comVenda)p.push(`${brl(f.comVenda)} por ${f.vendaAparelho?'aparelho vendido':'venda'}`);return p.join(' · ')||'Sem comissão'}
function dataEntrega(o){const h=[...(o.historico||[])].reverse().find(x=>x.status==='Entregue');return h?h.data:o.criada}
function diasEntre(a,b){const x=new Date(a),y=new Date(b);x.setHours(0,0,0,0);y.setHours(0,0,0,0);return Math.max(0,Math.round((y-x)/DIA))}
function dataBR(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''))?ymdBR(s):s?fd(s):'—'}
function osDias(o){return diasEntre(o.criada,FECHADAS.includes(o.status)?dataEntrega(o):new Date())}
function osAtraso(o){if(FECHADAS.includes(o.status)||o.status==='Pronta'||!o.previsao)return 0;const p=new Date(o.previsao+'T12:00'),t=todayStart();return p<t?diasEntre(p,t):0}
function periodo(k){
  const n=new Date(),agora=new Date(n.getTime()+1);
  if(k==='ant')return {de:new Date(n.getFullYear(),n.getMonth()-1,1),ate:new Date(n.getFullYear(),n.getMonth(),1)};
  if(k==='7d'){const de=todayStart();de.setDate(de.getDate()-6);return {de,ate:agora}}
  if(k==='tudo')return {de:new Date(2000,0,1),ate:agora};
  if(k==='semana'){const de=todayStart();de.setDate(de.getDate()-((de.getDay()+6)%7));const ate=new Date(de);ate.setDate(de.getDate()+7);return {de,ate}}
  if(k==='mesInteiro')return {de:new Date(n.getFullYear(),n.getMonth(),1),ate:new Date(n.getFullYear(),n.getMonth()+1,1)};
  return {de:new Date(n.getFullYear(),n.getMonth(),1),ate:agora};
}

/* Comissões */
function comissoes(per){
  const dentro=d=>{const x=new Date(d);return x>=per.de&&x<per.ate},pagas=DB.comPagas||{},res={};
  const add=(f,it)=>{(res[f.id]=res[f.id]||{f,itens:[]}).itens.push(it)};
  DB.os.filter(o=>o.status==='Entregue').forEach(o=>{const d=dataEntrega(o);if(!dentro(d))return;const f=funcById(o.tecnicoId)||funcByNome(o.tecnico);if(!f||!(+f.comServico))return;const sem=!!(f.soSemDono&&o.donoParticipou),k='os:'+o.id;add(f,{k,tipo:'Serviço',ref:'OS #'+o.num,act:'openOS',id:o.id,data:d,cli:cliNome(o.clienteId),base:osTotal(o),valor:sem?0:+f.comServico,motivo:sem?donoNome()+' participou':'',pago:pagas[k]||null})});
  DB.vendas.filter(v=>!v.osNum&&dentro(v.data)).forEach(v=>{const f=funcById(v.vendedorId);if(!f||!(+f.comVenda))return;const nAp=v.itens.filter(i=>i.tipo==='iphone').length;if(f.vendaAparelho&&!nAp)return;const k='v:'+v.id;add(f,{k,tipo:'Venda',ref:'Venda #'+v.num+(f.vendaAparelho?` · ${nAp} aparelho${nAp>1?'s':''}`:''),act:'recibo',id:v.id,data:v.data,cli:cliNome(v.clienteId),base:v.total,valor:+f.comVenda*(f.vendaAparelho?nAp:1),motivo:'',pago:pagas[k]||null})});
  Object.values(res).forEach(r=>{r.itens.sort((a,b)=>new Date(b.data)-new Date(a.data));r.serv=r.itens.filter(i=>i.tipo==='Serviço'&&i.valor>0).length;r.vend=r.itens.filter(i=>i.tipo==='Venda').length;r.aPagar=sum(r.itens.filter(i=>!i.pago).map(i=>i.valor));r.pago=sum(r.itens.filter(i=>i.pago).map(i=>i.valor));r.total=r.aPagar+r.pago});
  return res;
}
const PER_NOME={mes:'este mês',ant:'mês passado','7d':'últimos 7 dias',tudo:'todo o período'};
function vComissoes(){
  const res=comissoes(periodo(UI.comPer));
  const fs=funcsAtivos().filter(f=>+f.comServico||+f.comVenda);Object.values(res).forEach(r=>{if(!fs.includes(r.f))fs.push(r.f)});
  const rows=fs.map(f=>({f,r:res[f.id]||{itens:[],serv:0,vend:0,aPagar:0,pago:0,total:0}})),tot=k=>sum(rows.map(x=>x.r[k]));
  const seg=`<div class="seg">${[['mes','Este mês'],['ant','Mês passado'],['7d','7 dias'],['tudo','Tudo']].map(([k,l])=>`<button class="${UI.comPer===k?'on':''}" data-act="comPer" data-k="${k}">${l}</button>`).join('')}</div>`;
  return pageHead('Comissões','Por serviço entregue e por venda, conforme a regra de cada funcionário',seg)+
  `<div class="kpis k3"><div class="card kpi"><span class="l">A pagar</span><span class="v">${brl(tot('aPagar'))}</span><span class="s">${PER_NOME[UI.comPer]}</span></div><div class="card kpi"><span class="l">Já pago</span><span class="v">${brl(tot('pago'))}</span><span class="s">${PER_NOME[UI.comPer]}</span></div><div class="card kpi"><span class="l">Lançamentos com comissão</span><span class="v">${tot('serv')+tot('vend')}</span><span class="s">${tot('serv')} serviço${tot('serv')===1?'':'s'} · ${tot('vend')} venda${tot('vend')===1?'':'s'}</span></div></div>
  <section class="card"><div class="card-h"><h3>Por funcionário</h3><a class="btn sm ghost" href="#funcionarios">Regras e cadastro ${ic('arrow',14)}</a></div>
  ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Funcionário</th><th>Regra</th><th class="r">Serviços</th><th class="r">Vendas</th><th class="r">Pago</th><th class="r">A pagar</th><th></th></tr></thead><tbody>${rows.map(({f,r})=>`<tr class="click" data-act="comExtrato" data-id="${f.id}"><td><b>${esc(f.nome)}</b><span class="l2">${esc(f.funcao||'')}</span></td><td style="max-width:280px">${esc(regraTxt(f))}</td><td class="r">${r.serv}</td><td class="r">${r.vend}</td><td class="r">${brl(r.pago)}</td><td class="r"><b>${brl(r.aPagar)}</b></td><td class="r">${r.aPagar?`<button class="btn sm pri" data-act="comPagar" data-id="${f.id}">Pagar ${brl(r.aPagar)}</button>`:'<span class="muted">Em dia</span>'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-row">Nenhum funcionário com comissão. <a href="#funcionarios">Defina as regras em Funcionários</a>.</div>`}

  openDrawer(`Extrato de comissão · ${esc(f.nome)}`,body,`<button class="btn" data-act="copyTxt" data-t="${esc(extratoTxt(f,r))}" style="margin-right:auto">${ic('msg',16)}Copiar para WhatsApp</button><button class="btn" data-act="closeDrawer">Fechar</button>${r.aPagar?`<button class="btn pri" data-act="comPagar" data-id="${f.id}">Pagar ${brl(r.aPagar)}</button>`:''}`);

/* Metas */
const META_TIPOS=[['vendas_qtd','Vendas no balcão (quantidade)'],['vendas_valor','Vendas no balcão (R$)'],['servicos_qtd','Serviços entregues (quantidade)'],['faturamento','Faturamento total da loja (R$)']];
const metaTipoNome=t=>(META_TIPOS.find(x=>x[0]===t)||[0,t])[1];
const metaEhValor=t=>t==='vendas_valor'||t==='faturamento';
const fmtMeta=(t,v)=>metaEhValor(t)?brl(v):String(Math.round(v));
function metaPer(p){return periodo(p==='semana'?'semana':'mesInteiro')}
function realizado(m,per){
  const inP=d=>{const x=new Date(d);return x>=per.de&&x<per.ate},quem=x=>m.alvoDe==='loja'||x===m.alvoDe;
  if(m.tipo==='servicos_qtd')return DB.os.filter(o=>o.status==='Entregue'&&inP(dataEntrega(o))&&quem(o.tecnicoId)).length;
  if(m.tipo==='faturamento')return sum(DB.vendas.filter(v=>inP(v.data)).map(v=>v.total));
  const vs=DB.vendas.filter(v=>!v.osNum&&inP(v.data)&&quem(v.vendedorId));
  return m.tipo==='vendas_valor'?sum(vs.map(v=>v.total)):vs.length;
}
function metaStatus(m){
  const per=metaPer(m.periodo),feito=realizado(m,per),alvo=+m.alvo||0,pct=alvo?Math.min(100,Math.round(feito/alvo*100)):0;
  const dec=Math.min(1,Math.max(0,(Date.now()-per.de)/(per.ate-per.de))),st=alvo&&feito>=alvo?'ok':feito>=alvo*dec*0.9?'ritmo':'abaixo';
  return {feito,alvo,pct,st,faltam:Math.max(0,Math.ceil((per.ate-Date.now())/DIA))};
}
function metaCard(m){
  const s=metaStatus(m),quem=m.alvoDe==='loja'?'Loja':((funcById(m.alvoDe)||{}).nome||'—');
  const chip={ok:'<span class="chip ok plain">Atingida</span>',ritmo:'<span class="chip info plain">No ritmo</span>',abaixo:'<span class="chip warn plain">Abaixo do ritmo</span>'}[s.st];
  return `<button type="button" class="meta" data-act="formMeta" data-id="${m.id}"><span class="meta-top"><b>${esc(quem)}</b>${chip}</span><span class="meta-nm">${esc(metaTipoNome(m.tipo))} · ${m.periodo==='semana'?'semana':'mês'}</span><span class="bar ${s.st==='ok'?'ok':s.st==='abaixo'?'warn':''}"><i style="width:${s.pct}%"></i></span><span class="meta-num"><b>${fmtMeta(m.tipo,s.feito)}</b> de ${fmtMeta(m.tipo,s.alvo)} · ${s.pct}% · ${s.faltam>1?`faltam ${s.faltam} dias`:'último dia'}</span></button>`;
}
function vMetas(){

function plLista(){

/* Histórico do aparelho por nº de série ou IMEI */
function eventosAparelho(q){
  const qd=digits(q),qs=String(q||'').toUpperCase().replace(/\s/g,'');
  const bate=(imei,serie)=>(qd.length>=4&&digits(imei)&&digits(imei).includes(qd))||(qs.length>=5&&String(serie||'').toUpperCase().includes(qs));
  const ev=[];
  DB.iphones.forEach(i=>{if(bate(i.imei,i.serie)){const p=i.procedencia||{};ev.push({data:p.data||i.entrada,tipo:'Entrada no estoque',txt:`${i.modelo} ${i.cap} · ${procTxt(p)} · situação: ${i.status}`,act:'formIph',id:i.id,interno:true})}});
  DB.os.forEach(o=>{const a=o.aparelho||{};if(bate(a.imei,a.serie))ev.push({data:o.criada,tipo:`OS #${o.num} · ${o.status}`,txt:`${a.modelo} · ${cliNome(o.clienteId)} · ${o.defeito} · ${osDias(o)} dia(s) ${FECHADAS.includes(o.status)?'até a entrega':'na loja'}`,act:'openOS',id:o.id})});
  DB.vendas.forEach(v=>{v.itens.forEach(it=>{if(it.tipo==='iphone'&&bate(it.imei,it.serie))ev.push({data:v.data,tipo:`Venda #${v.num}`,txt:`Vendido para ${cliNome(v.clienteId)} por ${brl(it.valor)}`,act:'recibo',id:v.id})});if(v.troca&&bate(v.troca.imei,v.troca.serie))ev.push({data:v.data,tipo:`Recebido na troca · venda #${v.num}`,txt:`De ${cliNome(v.clienteId)}, avaliado em ${brl(v.troca.valor)}`,act:'recibo',id:v.id,interno:true})});
  const t=e=>/^\d{4}-\d{2}-\d{2}$/.test(String(e.data))?new Date(e.data+'T12:00'):new Date(e.data);
  return ev.sort((a,b)=>t(a)-t(b));
}
function histAparelho(q){
  const ev=eventosAparelho(q);

}

/* Migração: novos campos */
function migrar3(){
  if(!DB)return;let m=false;
  if(!Array.isArray(DB.gastos)){DB.gastos=[];m=true}
  if(!Array.isArray(DB.movs)){DB.movs=[];m=true}
  if(DB.loja&&DB.loja.margemPadrao==null){DB.loja.margemPadrao=30;m=true}
  DB.acessorios.forEach(a=>{if(!a.categoria){a.categoria=/^(CAP|PEL)/.test(a.sku||'')?'Capas e películas':/^(CAR|CAB|PWB)/.test(a.sku||'')?'Carregadores e cabos':/^FON/.test(a.sku||'')?'Áudio':'Suportes e outros';m=true}if(!a.finalidade){a.finalidade=/^(CAP|PEL)/.test(a.sku||'')?'Venda e brinde':'Venda';m=true}});
  DB.iphones.forEach(i=>{if(!i.reparos){i.reparos=[];m=true}if(!i.chegada){i.chegada={};m=true}if(i.margem==null){i.margem=DB.loja.margemPadrao||30;m=true}});
  if(m)save();
}

function crmDados(){

  return DB.clientes.map(c=>{
    const os=DB.os.filter(o=>o.clienteId===c.id),vs=DB.vendas.filter(v=>v.clienteId===c.id&&!v.osNum);
    const evs=[...os.map(o=>({d:o.criada,t:'Serviço',txt:(o.aparelho||{}).modelo||'aparelho',ap:(o.aparelho||{}).modelo})),...vs.map(v=>{const ip=v.itens.find(i=>i.tipo==='iphone');return {d:v.data,t:ip?'Compra de iPhone':'Compra',txt:v.itens.map(i=>i.desc).join(', '),ap:ip?ip.desc.replace(/\s*\(.*$/,''):null}})].sort((a,b)=>new Date(b.d)-new Date(a.d));

const ANEXO_MAX=1600,AX_URLS=new Map();
async function anexoPreparar(file){
  if(file.type==='application/pdf'){if(file.size>8e6)throw new Error('PDF maior que 8 MB.');return {nome:file.name,tipo:'application/pdf',blob:file}}
  if(!/^image\//.test(file.type))throw new Error('Envie uma foto ou um PDF.');
  const url=URL.createObjectURL(file),img=new Image();img.src=url;
  try{await img.decode()}catch(e){URL.revokeObjectURL(url);throw new Error('Não deu para ler essa foto. Tente JPG ou PNG.')}
  const k=Math.min(1,ANEXO_MAX/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));
  return {nome:(file.name||'foto').replace(/\.[^.]+$/,'')+'.jpg',tipo:'image/jpeg',blob};
}

/* ========== Versão online: login, banco único (Supabase) e tempo real ========== */
const ONLINE=(()=>{const c=window.SISTEMA_CONFIG||{};return {url:String(c.supabaseUrl||'').replace(/\/+$/,''),key:String(c.supabaseChavePublica||''),dominio:'loja.app'}})();

const ON_COLS=['clientes','iphones','acessorios','os','vendas','notas','funcionarios','metas','gastos','movs','pagamentosCom'];
const ON_SO_DONO=['config','funcionarios','metas','comPagas','pagamentosCom'];

// quem não é dono só cria (não altera) procedência; o técnico também só cria gastos; a vendedora edita gastos, menos compra de aparelho
const onSoCria=r=>r.colecao==='procedencias'||(r.colecao==='gastos'&&(ON.perfil.papel!=='vendedor'||(r.dados&&r.dados.categoria)==='Compra de aparelho'));

const PAPEL_NOME={dono:'Administrador',tecnico:'Técnico',vendedor:'Vendedor(a)'};
const ehDono=()=>!!(ON.perfil&&ON.perfil.papel==='dono');
const emailDe=u=>String(u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@'+ONLINE.dominio;

/* ---- dados <-> linhas do banco ---- */
function dbVazio(){
  const lojaBase=(()=>{const keep=DB;ON.mudo=true;try{seed()}finally{ON.mudo=false}const l=clone(DB.loja);DB=keep;return l})();
  ['fantasia','razao','cnpj','ie','im','end','bairro','cidade','uf','cep','tel','whats'].forEach(k=>lojaBase[k]='');lojaBase.cuf=0;
  return {loja:{...lojaBase,margemPadrao:lojaBase.margemPadrao??30},tecnicos:[],funcionarios:[],clientes:[],iphones:[],acessorios:[],os:[],vendas:[],notas:[],metas:[],gastos:[],movs:[],comPagas:{},pagamentosCom:[],seq:{os:1,venda:1,gasto:0,nf:{'NFC-e':1,'NF-e':1,'NFS-e':1}}};
}
function dbInicial(){

  D.funcionarios=[{id:'f0',nome:(ON.perfil&&ON.perfil.nome)||'Administrador',funcao:'Dono',dono:true,tel:'',cpf:'',pix:'',comServico:0,comVenda:0,soSemDono:false,vendaAparelho:false,ativo:true}];
  DB=D;D.metas=metasPadrao();return D;
}
function onLinhas(){
  const m=new Map(),put=(c,id,d)=>m.set(c+'|'+id,{colecao:c,id:String(id),dados:d});
  put('config','loja',DB.loja);put('seq','seq',DB.seq);
  ON_COLS.forEach(c=>(DB[c]||[]).forEach(x=>{if(!x||x.id==null)return;if(c==='iphones'){const {procedencia,...r}=x;put(c,x.id,r);if(procedencia&&procedencia.tipo)put('procedencias',x.id,procedencia)}else put(c,x.id,x)}));
  Object.entries(DB.comPagas||{}).forEach(([k,v])=>put('comPagas',k,{data:v}));

}
const T0=x=>new Date(x||0).getTime()||0;
function onOrdenar(D){
  D.os.sort((a,b)=>T0(b.criada)-T0(a.criada));D.vendas.sort((a,b)=>T0(b.data)-T0(a.data));D.notas.sort((a,b)=>T0(b.data)-T0(a.data));
  D.iphones.sort((a,b)=>T0(b.entrada)-T0(a.entrada));D.movs.sort((a,b)=>T0(b.data)-T0(a.data));D.gastos.sort((a,b)=>(b.num||0)-(a.num||0));
  D.pagamentosCom.sort((a,b)=>T0(b.data)-T0(a.data));D.clientes.sort((a,b)=>T0(a.criado)-T0(b.criado));
  D.acessorios.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt'));
  D.funcionarios.sort((a,b)=>(b.dono?1:0)-(a.dono?1:0)||String(a.id).localeCompare(String(b.id)));

function onMontar(rows){
  const D=dbVazio(),proc={};
  rows.forEach(r=>{const d=r.dados;
    if(r.colecao==='config'&&r.id==='loja')D.loja=d;
    else if(r.colecao==='seq')D.seq=d;
    else if(r.colecao==='comPagas')D.comPagas[r.id]=d.data;
    else if(r.colecao==='procedencias')proc[r.id]=d;
    else if(Array.isArray(D[r.colecao]))D[r.colecao].push(d)});
  D.iphones.forEach(i=>{if(proc[i.id])i.procedencia=proc[i.id]});
  onOrdenar(D);return D;
}

/* ---- gravação: só o que mudou, com nova tentativa se cair a conexão ---- */
function onAgendar(){clearTimeout(ON.timer);ON.timer=setTimeout(onSincronizar,350);onStatus('salvando')}
async function onSincronizar(){
  if(!ON.sb||!ON.perfil)return;
  if(ON.busy){ON.again=true;return}ON.busy=true;
  const agora=onLinhas(),up=[],ins=[],del={},dono=ehDono();
  agora.forEach((r,k)=>{const j=JSON.stringify(r.dados);if(ON.snap.get(k)===j)return;
    if(!dono&&ON_SO_DONO.includes(r.colecao))return;
    if(!dono&&onSoCria(r)){if(!ON.snap.has(k))ins.push([k,j,r]);return}
    up.push([k,j,r])});
  if(dono)ON.snap.forEach((j,k)=>{if(!agora.has(k)){const [c,...id]=k.split('|');(del[c]=del[c]||[]).push(id.join('|'))}});
  const lin=a=>a.map(([,,r])=>({colecao:r.colecao,id:r.id,dados:r.dados,atualizado:new Date().toISOString(),atualizado_por:ON.uid}));
  try{
    for(let i=0;i<up.length;i+=400){const p=up.slice(i,i+400);const {error}=await ON.sb.from('registros').upsert(lin(p),{onConflict:'colecao,id'});if(error)throw error;p.forEach(([k,j])=>ON.snap.set(k,j))}
    for(const x of ins){const {error}=await ON.sb.from('registros').upsert(lin([x]),{onConflict:'colecao,id',ignoreDuplicates:true});ON.snap.set(x[0],x[1]);if(error)console.warn('registro interno',error.message)}
    for(const c in del){const ids=del[c];for(let i=0;i<ids.length;i+=200){const p=ids.slice(i,i+200);const {error}=await ON.sb.from('registros').delete().eq('colecao',c).in('id',p);if(error)throw error;p.forEach(id=>ON.snap.delete(c+'|'+id))}}
    ON.falhas=0;onStatus('ok');
  }catch(e){
    ON.falhas++;onStatus('erro',e);
    if(/JWT|token|auth/i.test(e.message||''))await ON.sb.auth.refreshSession().catch(()=>{});
    setTimeout(onAgendar,Math.min(30000,2000*ON.falhas));
  }finally{ON.busy=false;if(ON.again){ON.again=false;onAgendar()}}
}
function onPendente(){const a=onLinhas();for(const [k,r] of a){const j=JSON.stringify(r.dados);if(ON.snap.get(k)!==j){if(!ehDono()&&ON_SO_DONO.includes(r.colecao))continue;if(!ehDono()&&onSoCria(r)&&ON.snap.has(k))continue;return true}}return false}
function onStatus(s,e){ON.estado=s;const el=$('#onSync');if(!el)return;
  el.className='on-sync '+s;el.textContent=s==='ok'?'Tudo salvo':s==='salvando'?'Salvando…':'Sem conexão · tentando de novo';
  el.title=s==='erro'&&e?String(e.message||e):''}

/* ---- tempo real: o que outro computador salvar aparece aqui ---- */
function onAplicar(p){
  const r=(p.new&&p.new.colecao)?p.new:p.old;if(!r||!r.colecao)return;
  if(p.eventType!=='DELETE'&&p.new.atualizado_por&&p.new.atualizado_por===ON.uid)return;
  const c=r.colecao,id=r.id,k=c+'|'+id;
  if(p.eventType==='DELETE'){
    ON.snap.delete(k);
    if(c==='comPagas')delete DB.comPagas[id];else if(c==='procedencias'){const i=DB.iphones.find(x=>x.id===id);if(i)delete i.procedencia}
    else if(Array.isArray(DB[c]))DB[c]=DB[c].filter(x=>x.id!==id);
  }else{
    const d=r.dados;ON.snap.set(k,JSON.stringify(d));
    if(c==='config'&&id==='loja')DB.loja=d;
    else if(c==='seq'){const s=DB.seq;['os','venda','gasto'].forEach(q=>s[q]=Math.max(+s[q]||0,+d[q]||0));s.nf=s.nf||{};Object.keys(d.nf||{}).forEach(q=>s.nf[q]=Math.max(+s.nf[q]||0,+d.nf[q]||0));if(JSON.stringify(s)!==JSON.stringify(d))onAgendar()}
    else if(c==='comPagas')DB.comPagas[id]=d.data;
    else if(c==='procedencias'){const i=DB.iphones.find(x=>x.id===id);if(i)i.procedencia=d;else ON.orfas[id]=d}
    else if(Array.isArray(DB[c])){const a=DB[c],i=a.findIndex(x=>x.id===id);
      if(c==='iphones'){const pr=(i>=0&&a[i].procedencia)||ON.orfas[id];if(pr){d.procedencia=pr;delete ON.orfas[id]}}
      if(i>=0)a[i]=d;else{a.unshift(d);onOrdenar(DB)}}
  }
  ON.pend=true;onRenderSePuder();
}

/* ---- assistente de IA: usa a função "assistente" do Supabase (a chave fica lá, não no site) ---- */
function onSampleShim(){
  async function chamar(input,opts,json){
    opts=opts||{};
    const {data:{session}}=await ON.sb.auth.getSession();if(!session)throw {code:'sem_login'};
    const messages=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:String(m.content)}));
    let r;
    try{r=await fetch(ONLINE.url+'/functions/v1/assistente',{method:'POST',signal:opts.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:ONLINE.key},body:JSON.stringify({messages,tier:opts.modelTier==='quick'?'quick':'default',json:!!json})})}
    catch(e){throw {code:(e&&e.name==='AbortError')?'cancelled':'upstream_error'}}
    if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw {code:(j.error&&j.error.code)||(r.status===404?'sem_funcao':'upstream_error')}}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='',stop=null;
    try{
      for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
        while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);if(!l.trim())continue;const o=JSON.parse(l);
          if(o.error)throw {code:o.error.code,text};
          if(o.t){text+=o.t;if(opts.onText)opts.onText({text,delta:o.t})}
          else if(o.done)stop=o.stop}}
    }catch(e){if(opts.signal&&opts.signal.aborted)throw {code:'cancelled',text};throw (e&&e.code)?e:{code:'upstream_error',text}}
    if(!text&&stop!=='max_tokens')throw {code:'empty_completion'};
    return {text,truncated:stop==='max_tokens'};
  }
  const s=(input,opts)=>chamar(input,opts,false);
  s.json=async(input,opts)=>{const r=await chamar(input,opts,true);const m=r.text.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null};
  s.limits=async()=>({images:false});
  return s;
}

  return {id,nome:p.nome,tipo:p.tipo,path,em:new Date().toISOString()};
};
anexoURL=async a=>{if(a.data)return a.data;const {data,error}=await ON.sb.storage.from('comprovantes').createSignedUrl(a.path,3600);if(error||!data)throw error||new Error('sem link');return data.signedUrl};

const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const CUF={RO:11,AC:12,AM:13,RR:14,PA:15,AP:16,TO:17,MA:21,PI:22,CE:23,RN:24,PB:25,PE:26,AL:27,SE:28,BA:29,MG:31,ES:32,RJ:33,SP:35,PR:41,SC:42,RS:43,MS:50,MT:51,GO:52,DF:53};
function onBoasVindas(){
  const L=DB.loja;FORM={kind:'boasvindas',d:{fantasia:L.fantasia||'',razao:L.razao||'',cnpj:L.cnpj||'',whats:L.whats||'',end:L.end||'',bairro:L.bairro||'',cidade:L.cidade||'',uf:L.uf||'',cep:L.cep||''}};
  const f=(l,k,x='',cls='')=>fld(l,`<input data-f="d.${k}" id="bv-${k}" value="${esc(FORM.d[k])}" ${x}>`,cls);
  openModal('Bem-vindo! Vamos configurar a sua loja',`<div class="sec"><p class="muted" style="margin:0">Estes dados aparecem no menu, nos comprovantes e nas mensagens aos clientes. Dá para mudar depois em Configurações.</p><div class="g2">
    ${f('Nome da loja','fantasia','placeholder="Ex.: Assistência Silva"','span2')}${f('Razão social','razao')}${f('CNPJ','cnpj','data-mask="cpf" inputmode="numeric"')}
    ${f('WhatsApp','whats','data-mask="tel" inputmode="tel"')}${f('CEP','cep')}${f('Endereço','end','placeholder="Rua, número, loja"','span2')}${f('Bairro','bairro')}${f('Cidade','cidade')}
    ${fld('UF',`<select data-f="d.uf" id="bv-uf">${optV([['','—'],...UFS.map(u=>[u,u])],FORM.d.uf)}</select>`)}
  </div></div>`,`<span class="form-err" id="bvErr"></span><button class="btn" data-act="closeModal">Depois</button><button class="btn pri" data-act="onBoasVindasOk">${ic('check')}Salvar e começar</button>`);
  setTimeout(()=>{const e=$('#bv-fantasia');if(e)e.focus()},50);
}
ACT.onBoasVindasOk=()=>{const d=FORM&&FORM.kind==='boasvindas'?FORM.d:null;if(!d)return;
  if(!String(d.fantasia||'').trim()){$('#bvErr').textContent='Informe o nome da loja.';return}
  Object.keys(d).forEach(k=>DB.loja[k]=String(d[k]||'').trim());DB.loja.cuf=CUF[DB.loja.uf]||0;save();closeModal();route();
  toast('Pronto! Agora cadastre a equipe em Funcionários e envie a logo em Configurações.')};

onIniciar();
document.addEventListener('submit',e=>{if(e.target.id==='aiForm'){e.preventDefault();sendAI()}});
